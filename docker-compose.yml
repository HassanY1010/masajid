services:
  postgres:
    image: postgres:16-alpine
    container_name: masajid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: masajid_db
    ports:
      - "5432:5432"
    volumes:
      - masajid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d masajid_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  masajid_pgdata:
