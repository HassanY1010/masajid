name: masajid_mobile
description: "منصة مساجد لخدمة بيوت الله - تطبيق الزائر للمساهمة في احتياجات المساجد"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & Serialization
  dio: ^5.4.3+1
  intl: ^0.20.2

  # UI, Icons, Images & Files
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
