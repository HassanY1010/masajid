        value: AdminPassword123!

  # 2. React Admin Dashboard (Static Site)
  - type: web
    name: masajid-admin
    env: static
    buildCommand: pnpm install && pnpm --filter @masajid/shared-types build && pnpm --filter @masajid/shared-validation build && pnpm --filter @masajid/admin build
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://masajid-api.onrender.com/api
