        value: https://lbjegtcnxaihqaaywawc.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiamVndGNueGFpaHFhYXl3YXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTQ0NzUsImV4cCI6MjEwMzY5MDQ3NX0.azDQwPHz7guqGmyURX9zlBbzIttOY8dtk2da0RInWaU
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiamVndGNueGFpaHFhYXl3YXdjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODExNDQ3NSwiZXhwIjoyMTAzNjkwNDc1fQ.MUC2dJOsiPd741KpNDYeD8AYA_YBK3WlByrDD_a3d7s
      - key: SUPABASE_BUCKET
        value: masajid-uploads
      - key: STORAGE_DRIVER
        value: supabase
      - key: JWT_SECRET
