services:
  # 1. NestJS Backend API Service
  - type: web
    name: masajid-api
    env: node
    plan: free
    region: frankfurt # or singapore / oregon
    buildCommand: pnpm install && pnpm --filter @masajid/shared-types build && pnpm --filter @masajid/shared-validation build && pnpm --filter @masajid/api prisma:generate && pnpm --filter @masajid/api prisma:push && pnpm --filter @masajid/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        value: postgresql://postgres.lbjegtcnxaihqaaywawc:hhaall112233qaz@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?schema=public&pgbouncer=true
